name: Deploy XuanLi to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild base site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/xuanli-src site
          cat .deploy/part*.b64 | base64 -d > /tmp/xuanli.zip
          unzip -q /tmp/xuanli.zip -d /tmp/xuanli-src
          cp -R /tmp/xuanli-src/bazi-calendar-pwa/. site/

      - name: Apply v0.2 source overrides
        shell: bash
        run: |
          set -euo pipefail
          cat src-overrides/app.js.part* > site/app.js
          cat src-overrides/bazi-engine.js.part* > site/bazi-engine.js
          cat src-overrides/styles.css.part* > site/styles.css
          cat src-overrides/index.html.part* > site/index.html
          cat src-overrides/sw.js.part* > site/sw.js
          cat src-overrides/README.md.part* > site/README.md
          node --check site/app.js
          node --check site/bazi-engine.js
          grep -q "0.3.0" site/app.js
          grep -q "BaziStrength" site/bazi-engine.js
          grep -q "大运起运算法" site/index.html

      - name: Vendor deterministic lunar calendar library
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2             https://cdn.jsdelivr.net/npm/lunar-javascript@1.7.7/lunar.js             -o site/lunar.js
          test -s site/lunar.js
          grep -q './lunar.js' site/index.html
          grep -q './lunar.js' site/sw.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
