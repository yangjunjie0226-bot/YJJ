name: Deploy XuanLi to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild base site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/xuanli-src site
          cat .deploy/part*.b64 | base64 -d > /tmp/xuanli.zip
          unzip -q /tmp/xuanli.zip -d /tmp/xuanli-src
          cp -R /tmp/xuanli-src/bazi-calendar-pwa/. site/

      - name: Apply v0.5 source and run checks
        shell: bash
        run: |
          set -euo pipefail
          cp src/* site/
          for file in site/*.js; do node --check "$file"; done
          node tests/rules.cjs site
          grep -q "0.5.0" site/app.js
          grep -q "大运起运算法" site/index.html

      - name: Vendor deterministic lunar calendar library
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2             https://cdn.jsdelivr.net/npm/lunar-javascript@1.7.7/lunar.js             -o site/lunar.js
          test -s site/lunar.js
          node --check site/lunar.js
          node tests/calendar.cjs site
          grep -q './lunar.js' site/index.html
          grep -q './lunar.js' site/sw.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


      - name: Checkout for live deployment verification
        uses: actions/checkout@v4

      - name: Verify public Pages release
        shell: bash
        run: |
          set -euo pipefail
          base="https://yangjunjie0226-bot.github.io/YJJ"
          for attempt in $(seq 1 18); do
            ready=true
            for file in index.html app.js bazi-engine.js bazi-advanced.js bazi-v05.js styles.css sw.js; do
              if ! curl -fsSL --max-time 20 "$base/$file?release=$GITHUB_SHA&attempt=$attempt" -o "/tmp/live-$file" || ! cmp -s "src/$file" "/tmp/live-$file"; then
                ready=false
                break
              fi
            done
            if [ "$ready" = true ]; then break; fi
            sleep 10
          done
          test "$ready" = true
          for file in manifest.webmanifest lunar.js icons/icon-180.png icons/icon-192.png icons/icon-512.png; do
            curl -fsSL --retry 3 --max-time 30 "$base/$file?release=$GITHUB_SHA" -o /tmp/live-asset
            test -s /tmp/live-asset
          done
          curl -fsSL --retry 3 --max-time 30 "$base/" -o /tmp/live-home.html
          grep -q 'bazi-v05.js' /tmp/live-home.html
          echo "Verified public v0.5.0 files and offline assets at $base/"
